<svg viewBox="0 0 460 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E0A3"/>
      <stop offset="45%" stop-color="#D9B65C"/>
      <stop offset="100%" stop-color="#B8912F"/>
    </linearGradient>
    <linearGradient id="goldGradSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAD08C"/>
      <stop offset="100%" stop-color="#C79A3E"/>
    </linearGradient>
  </defs>

  <!-- Fondo navy oscuro (coincide con la barra lateral de la Intranet) -->
  <rect x="0" y="0" width="460" height="230" fill="#111C3D"/>

  <!-- Simbolo lambda, dorado, superpuesto a la derecha del wordmark -->
  <text x="298" y="172"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="190"
        font-weight="700"
        fill="url(#goldGrad)"
        stroke="#111C3D"
        stroke-width="2">&#955;</text>

  <!-- Wordmark "Logos", dorado sobre navy -->
  <text x="26" y="128"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="86"
        font-weight="700"
        letter-spacing="1"
        fill="url(#goldGradSoft)"
        stroke="#0A1330"
        stroke-width="1.2">Logos</text>

  <!-- Tagline, en blanco/crema para legibilidad sobre navy -->
  <text x="26" y="196"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="21"
        font-weight="600"
        letter-spacing="0.5"
        fill="#F4EFE3">Transformem el discurs social</text>
</svg>
