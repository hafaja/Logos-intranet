<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intranet Logos</title>
<meta name="theme-color" content="#16233F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3EC; --paper:#FFFFFF; --ink:#16233F; --ink-soft:#545F78; --line:#E1DFD3;
    --navy:#16233F; --navy-dark:#0B1526; --gold:#C99A2E; --gold-soft:#FAF0D6;
    --alert:#A8431F; --alert-soft:#FBE7DE;
    --good:#2F6B27; --good-soft:#DDEFD9;
    --font-display:'Fraunces',serif; --font-body:'Atkinson Hyperlegible',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--ink);}

  #app{min-height:100vh;display:flex;}

  /* Menú lateral (escritorio) */
  .sidebar{width:230px;flex-shrink:0;background:linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%);color:#fff;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
  .brand-logo-sidebar{width:100%;max-width:170px;margin-bottom:10px;display:block;}
  .sidebar-brand{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.3;margin-bottom:2px;}
  .sidebar-brand span{color:var(--gold);}
  .sidebar-sub{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:28px;}
  .sidebar nav{display:flex;flex-direction:column;gap:4px;flex:1;}
  .sidebar nav button{text-align:left;background:none;border:none;color:rgba(255,255,255,.75);font-family:var(--font-body);font-weight:700;font-size:13.5px;padding:11px 14px;border-radius:10px;cursor:pointer;transition:background .15s;}
  .sidebar nav button:hover{background:rgba(255,255,255,.06);}
  .sidebar nav button.active{background:var(--gold);color:var(--navy-dark);}
  .nav-badge{display:inline-block;background:var(--alert);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;}
  .sidebar nav button.active .nav-badge{background:var(--navy-dark);color:#fff;}
  .sidebar-logout{background:none;border:1.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);border-radius:10px;padding:10px;font-family:var(--font-body);font-weight:700;font-size:12.5px;cursor:pointer;margin-top:auto;}
  .sidebar-logout:hover{border-color:var(--alert);color:#fff;}

  /* Área principal */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
  .main-content{max-width:1080px;width:100%;margin:0 auto;padding:32px 40px 60px;flex:1;}
  #screen-login .main-content{max-width:440px;padding-top:8vh;}

  .hero{background:linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);color:#fff;padding:34px 34px 30px;position:relative;overflow:hidden;border-radius:18px;}
  .hero::after{content:'λ';position:absolute;right:-10px;top:-36px;font-family:var(--font-display);font-weight:700;font-size:190px;color:rgba(201,154,46,.14);pointer-events:none;}
  .hero-brand{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;position:relative;}
  .hero-title{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1.25;position:relative;}
  .hero-sub{font-size:13.5px;color:rgba(255,255,255,.7);margin-top:6px;position:relative;}

  .topbar{padding:0 0 18px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--navy);}
  .back-btn{border:none;background:none;cursor:pointer;font-weight:700;font-size:14px;color:var(--navy);}
  .content{flex:1;}
  h2.screen-title{font-family:var(--font-display);font-weight:600;font-size:23px;margin:14px 0 4px;}
  .subtle{color:var(--ink-soft);font-size:13.5px;line-height:1.45;margin:0 0 16px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--font-body);font-size:14px;color:var(--ink);background:var(--paper);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy);}
  .checkbox-row{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px;cursor:pointer;}
  .checkbox-row input{margin-top:3px;flex-shrink:0;}

  .primary-btn{background:var(--navy);color:#fff;border:none;border-radius:14px;padding:14px 22px;font-family:var(--font-body);font-weight:700;font-size:14.5px;cursor:pointer;margin-top:4px;transition:transform .12s, box-shadow .12s;}
  #screen-login .primary-btn{width:100%;}
  .primary-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(22,35,63,.18);}
  .primary-btn:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none;}
  .gold-btn{background:var(--gold);}
  .link-btn{background:none;border:none;color:var(--navy);font-family:var(--font-body);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;padding:0;}
  .auth-error{background:var(--alert-soft);border:1.5px solid var(--alert);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--alert);margin-bottom:12px;}
  .auth-ok{background:var(--good-soft);border:1.5px solid var(--good);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--good);margin-bottom:12px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:14px;margin:16px 0 24px;}
  .stat-card{background:var(--paper);border:1.5px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;padding:18px 10px;text-align:center;transition:transform .15s, box-shadow .15s;}
  .stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(22,35,63,.08);}
  .stat-num{font-family:var(--font-display);font-size:30px;font-weight:600;color:var(--navy);line-height:1;}
  .stat-label{font-size:11px;color:var(--ink-soft);margin-top:5px;text-transform:uppercase;letter-spacing:.03em;}

  .cards-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));gap:16px;align-items:start;}
  .panel-card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:0;opacity:0;transform:translateY(10px);animation:fadeUp .5s ease forwards;}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}

  .info-box{position:relative;border-radius:14px;padding:22px 20px 18px;margin:18px 0;border:1.5px solid;}
  .info-box::before{position:absolute;top:-14px;left:20px;font-size:19px;background:var(--bg);padding:0 8px;}
  .info-box-title{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;margin-bottom:8px;}
  .info-box p{font-size:13.5px;line-height:1.6;margin:0 0 6px;}
  .info-box .source{font-size:11px;font-style:italic;opacity:.75;margin-top:6px;}
  .info-box-navy{background:linear-gradient(135deg, #EEF1F6, #E7EBF2);border-color:#C7D0DE;}
  .info-box-navy::before{content:'🔎';}
  .info-box-navy .info-box-title{color:var(--navy);}
  .info-box-gold{background:var(--gold-soft);border-color:var(--gold);}
  .info-box-gold::before{content:'💡';}
  .info-box-gold .info-box-title{color:#7A5A16;}

  .pull-quote{border-left:4px solid var(--gold);padding:16px 20px;margin:16px 0;background:var(--paper);border-radius:0 12px 12px 0;font-family:var(--font-display);font-size:15.5px;line-height:1.55;color:var(--navy);font-style:italic;}

  .level-pill{display:inline-block;padding:5px 14px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.3px;}
  .lp-good{background:var(--good-soft);color:var(--good);}
  .lp-gold{background:var(--gold-soft);color:#7A5A16;}
  .lp-off{background:#EEE;color:#888;}
  .panel-card h3{margin:0 0 10px;font-size:13.5px;color:var(--navy);font-family:var(--font-body);}
  .panel-stat-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .panel-stat-row:last-child{border-bottom:none;}
  .empty-note{font-size:12.5px;color:var(--ink-soft);padding:8px 2px;}

  .bar-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:8px;}
  .bar-label{width:38%;flex-shrink:0;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;background:var(--bg);border-radius:6px;height:9px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg, var(--gold), var(--navy));border-radius:6px;width:0;transition:width .8s ease;}
  .bar-val{width:26px;text-align:right;font-weight:700;color:var(--navy);flex-shrink:0;}

  .list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .list-row:last-child{border-bottom:none;}
  .chip{font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 9px;}
  .chip.gold{background:var(--gold-soft);color:#7A5A16;}
  .chip.good{background:var(--good-soft);color:var(--good);}
  .chip.off{background:#EEE;color:#888;}
  .resultado-btn{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 6px;font-family:var(--font-body);font-weight:700;font-size:12px;cursor:pointer;color:var(--ink-soft);}
  .resultado-btn.sel-good{background:var(--good);color:#fff;border-color:var(--good);}
  .resultado-btn.sel-gold{background:var(--gold);color:#fff;border-color:var(--gold);}
  .resultado-btn.sel-alert{background:var(--alert);color:#fff;border-color:var(--alert);}
  .persona-tabs{display:flex;gap:4px;overflow-x:auto;margin:16px 0 12px;border-bottom:1.5px solid var(--line);}
  .ptab-btn{background:none;border:none;padding:9px 14px;font-family:var(--font-body);font-weight:700;font-size:12.5px;color:var(--ink-soft);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;}
  .ptab-btn.active{color:var(--navy);border-bottom-color:var(--gold);}
  .ptab-content{display:none;}
  .ptab-content.active{display:block;}

  .screen{display:none;}
  .screen.active{display:block;}
  .placeholder{padding:60px 10px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
  .section-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:4px 0 8px;}
  .doc-upload-row{border:1.5px dashed var(--line);border-radius:12px;padding:12px;text-align:center;margin-top:8px;}

  /* Formularios más estrechos y legibles en pantallas anchas */
  #screen-atencion .main-content, #screen-persona .main-content{max-width:760px;}

  /* Adaptación a pantallas estrechas: el menú lateral pasa a barra inferior */
  @media (max-width: 760px){
    #app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:sticky;bottom:0;top:auto;order:2;flex-direction:row;align-items:center;padding:8px 6px;border-top:1.5px solid rgba(255,255,255,.1);}
    .brand-logo-sidebar,.sidebar-brand,.sidebar-sub,.sidebar-logout{display:none;}
    .sidebar nav{flex-direction:row;width:100%;}
    .sidebar nav button{flex:1;text-align:center;font-size:11px;padding:8px 4px;}
    .main{order:1;}
    .main-content{padding:20px 18px 90px;}
    #screen-login .main-content{padding-top:10vh;}
  }
</style>
</head>

<script>
const SUPABASE_URL = 'https://foxtlpyfedwsvttzorql.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ght82ml0pvg0_nQvunlXVA_u0WjRscq';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let CURRENT_USER = null;
let IS_STAFF = false;

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.sidebar nav button').forEach(b=>b.classList.remove('active'));
  const group = { atencion:'miespacio', persona:'panel' };
  const target = group[name] || name;
  const btn = document.querySelector('.sidebar nav button[data-target="'+target+'"]');
  if(btn) btn.classList.add('active');
}

function animateNumber(el, target){
  if(!el) return;
  let cur = 0;
  const step = Math.max(1, Math.ceil(target / 24));
  const tick = () => {
    cur = Math.min(target, cur + step);
    el.textContent = cur;
    if(cur < target) requestAnimationFrame(tick);
  };
  tick();
}

function barRow(label, val, max){
  const pct = max > 0 ? Math.round((val / max) * 100) : 0;
  return `<div class="bar-row">
    <span class="bar-label">${label}</span>
    <span class="bar-track"><span class="bar-fill" data-w="${pct}" style="width:0;"></span></span>
    <span class="bar-val">${val}</span>
  </div>`;
}
function activarBarras(){
  document.querySelectorAll('.bar-fill[data-w]').forEach(el => {
    requestAnimationFrame(() => { el.style.width = el.dataset.w + '%'; });
  });
}

let CURRENT_USER_NOMBRE = null;

async function checkStaff(){
  if(!CURRENT_USER){ IS_STAFF = false; IS_ADMIN = false; CURRENT_USER_NOMBRE = null; return; }
  const { data } = await sb.from('staff').select('email, es_admin, activo, nombre').eq('email', CURRENT_USER.email).maybeSingle();
  IS_STAFF = !!(data && data.activo !== false);
  IS_ADMIN = !!(data && data.es_admin && data.activo !== false);
  CURRENT_USER_NOMBRE = (data && data.nombre) || null;
  document.getElementById('nav-admin-btn').style.display = IS_ADMIN ? '' : 'none';
}

let __intervaloBadge = null;

async function actualizarBadgePanel(){
  if(!IS_STAFF){ return; }
  const [notifs, consultas] = await Promise.all([
    sb.from('notificaciones').select('id', { count: 'exact', head: true }).eq('leida', false),
    sb.from('consultas_orientacion').select('id', { count: 'exact', head: true }).eq('estado', 'pendiente')
  ]);
  const total = (notifs.count || 0) + (consultas.count || 0);
  const badge = document.getElementById('badge-panel');
  if(!badge) return;
  if(total > 0){
    badge.textContent = total > 99 ? '99+' : total;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

function iniciarRefrescoBadge(){
  actualizarBadgePanel();
  clearInterval(__intervaloBadge);
  __intervaloBadge = setInterval(actualizarBadgePanel, 60000); // cada 60 segundos
}

function detenerRefrescoBadge(){
  clearInterval(__intervaloBadge);
}

let AUTH_MODE = 'login';

function renderLogin(errorMsg){
  document.getElementById('login-content').innerHTML = `
    ${errorMsg ? `<div class="auth-error">${errorMsg}</div>` : ''}
    ${AUTH_MODE === 'signup' ? `<p class="subtle">Solo puedes crear cuenta si el responsable ya ha añadido tu correo en "Gestión de personal".</p>` : ''}
    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="login-email" autocomplete="email">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="login-password" autocomplete="${AUTH_MODE === 'login' ? 'current-password' : 'new-password'}">
    </div>
    <button class="primary-btn" id="login-btn" onclick="submitAuth()">${AUTH_MODE === 'login' ? 'Entrar' : 'Crear cuenta'}</button>
    <p style="text-align:center;margin-top:14px;">
      <button class="link-btn" onclick="toggleAuthMode()">${AUTH_MODE === 'login' ? '¿Primera vez? Crear cuenta' : '¿Ya tienes cuenta? Entra'}</button>
    </p>
  `;
}

function toggleAuthMode(){
  AUTH_MODE = AUTH_MODE === 'login' ? 'signup' : 'login';
  renderLogin();
}

async function submitAuth(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  if(!email || !password){ renderLogin('Rellena el correo y la contraseña.'); return; }
  btn.disabled = true;
  btn.textContent = AUTH_MODE === 'login' ? 'Entrando…' : 'Creando cuenta…';

  if(AUTH_MODE === 'login'){
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ renderLogin(error.message); return; }
    // onAuthStateChange se encarga de comprobar si es personal y llevar a Mi espacio
    return;
  }

  // Registro: solo funcionará de verdad si el correo ya está en la tabla staff
  // (añadido antes por el Administrador). Si no lo está, se rechazará al comprobar.
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){ renderLogin(error.message); return; }
  if(!data.session){
    const msg = 'Hemos enviado un correo de confirmación a ' + email + '. Ábrelo y toca el enlace para activar la cuenta, y luego vuelve aquí y entra.';
    AUTH_MODE = 'login';
    renderLogin();
    document.getElementById('login-content').insertAdjacentHTML('afterbegin', `<div class="auth-ok">${msg}</div>`);
  }
  // si data.session sí existe, onAuthStateChange comprueba sola si es personal
}

function toggleSidebarVisible(visible){
  document.querySelector('.sidebar nav').style.display = visible ? 'flex' : 'none';
  document.getElementById('sidebar-logout-btn').style.display = visible ? '' : 'none';
}

async function cerrarSesion(){
  await sb.auth.signOut();
  IS_STAFF = false; IS_ADMIN = false;
  toggleSidebarVisible(false);
  detenerRefrescoBadge();
  showScreen('login');
  renderLogin();
}

async function initAuth(){
  toggleSidebarVisible(false);
  const { data } = await sb.auth.getSession();
  CURRENT_USER = data.session ? data.session.user : null;
  await checkStaff();

  sb.auth.onAuthStateChange(async (_event, session) => {
    CURRENT_USER = session ? session.user : null;
    await checkStaff();
    if(!CURRENT_USER){
      toggleSidebarVisible(false);
      detenerRefrescoBadge();
      showScreen('login'); renderLogin();
      return;
    }
    if(!IS_STAFF){
      toggleSidebarVisible(false);
      renderLogin('Esta plataforma es solo para personal de Logos. Este correo no tiene acceso.');
      await sb.auth.signOut();
      return;
    }
    toggleSidebarVisible(true);
    iniciarRefrescoBadge();
    showScreen('miespacio');
    renderMiEspacio();
  });

  if(!CURRENT_USER){
    renderLogin();
    return;
  }
  if(!IS_STAFF){
    renderLogin('Esta plataforma es solo para personal de Logos. Este correo no tiene acceso.');
    await sb.auth.signOut();
    return;
  }
  toggleSidebarVisible(true);
  iniciarRefrescoBadge();
  showScreen('miespacio');
  renderMiEspacio();
}

  let nombresActuacion = {};
  if(misActuaciones.length){
    const idsAct = [...new Set(misActuaciones.map(a => a.usuario_id))];
    const { data: perfilesAct } = await sb.from('perfiles').select('id, nombre_completo').in('id', idsAct);

  }

  const { data: misRevisionesRaw } = await sb.from('actuaciones').select('*').eq('tecnico_email', email).not('fecha_proxima_revision', 'is', null).order('fecha_proxima_revision', { ascending:true });
  const misRevisiones = misRevisionesRaw || [];
  let nombresRevision = {};
  if(misRevisiones.length){
    const ids = [...new Set(misRevisiones.map(r => r.usuario_id))];
    const { data: perfilesRev } = await sb.from('perfiles').select('id, nombre_completo').in('id', ids);
    (perfilesRev || []).forEach(p => { nombresRevision[p.id] = p.nombre_completo; });

  const hoyCount = lista.filter(a => new Date(a.creado_en) >= hoy).length;

  const actuacionesRecientesHtml = misActuaciones.slice(0, 8).map(ac => `
    <div class="list-row">
      <span>${nombresActuacion[ac.usuario_id] || 'Sin nombre'}${ac.categoria ? `<br><span class="subtle" style="font-size:11px;margin:0;">${ac.categoria}</span>` : ''}</span>
      <span style="display:flex;align-items:center;gap:8px;">
        ${ac.resultado ? `<span class="chip ${ac.resultado==='conseguido'?'good':(ac.resultado==='no_conseguido'?'':'gold')}" style="${ac.resultado==='no_conseguido'?'background:var(--alert-soft);color:var(--alert);':''}">${ac.resultado==='conseguido'?'Conseguido':(ac.resultado==='en_tramite'?'En trámite':'No conseguido')}</span>` : ''}

  const horaFmt = iso => new Date(iso).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
  const duracionFmt = (ini, fin) => {
    const min = Math.round((new Date(fin) - new Date(ini)) / 60000);
    return `${Math.floor(min/60)}h ${min%60}min`;
  };

  const ultimoFichaje = fichajesDeHoy[fichajesDeHoy.length - 1];
  const fichadoAhora = ultimoFichaje && !ultimoFichaje.salida;

  cont.innerHTML = `

let __busquedaAtencionTimeout = null;
function renderBuscarPersonaActuacion(){

    <p class="subtle">Busca a la persona. Se abrirá su ficha, directamente en la pestaña "Actuaciones", lista para rellenar.</p>

    </div>
    <div id="bp-resultados"></div>
  `;

let __busquedaPersonaActuacionTimeout = null;
function buscarPersonaActuacion(texto){
  clearTimeout(__busquedaPersonaActuacionTimeout);
  const cont = document.getElementById('bp-resultados');
  if(!texto || texto.trim().length < 2){ cont.innerHTML = ''; return; }
  __busquedaPersonaActuacionTimeout = setTimeout(async () => {
    const { data, error } = await sb.from('perfiles').select('id, nombre_completo, municipio').ilike('nombre_completo', `%${texto.trim()}%`).limit(8);
    if(error || !data || !data.length){ cont.innerHTML = `<div class="empty-note">Sin resultados. Recuerda: la persona debe tener ya una cuenta creada en Logos Acompanya.</div>`; return; }
    cont.innerHTML = data.map(p => `
      <div class="list-row" style="cursor:pointer;" onclick="verPersonaStaff('${p.id}','miespacio')">
        <span>${p.nombre_completo}</span><span class="subtle" style="margin:0;">${p.municipio || ''}</span>
      </div>`).join('');
  }, 300);
}

function buscarUsuarioAtencion(texto){
  clearTimeout(__busquedaAtencionTimeout);
  const cont = document.getElementById('at-resultados-busqueda');
  if(!texto || texto.trim().length < 2){ cont.innerHTML = ''; return; }
  __busquedaAtencionTimeout = setTimeout(async () => {
    const { data, error } = await sb.from('perfiles').select('id, nombre_completo, municipio').ilike('nombre_completo', `%${texto.trim()}%`).limit(5);
    if(error || !data || !data.length){ cont.innerHTML = `<div class="empty-note">Sin resultados.</div>`; return; }
    cont.innerHTML = data.map(p => `
      <div class="list-row" style="cursor:pointer;" onclick="vincularUsuarioAtencion('${p.id}', ${JSON.stringify(p.nombre_completo || '')})">
        <span>${p.nombre_completo}</span><span class="subtle" style="margin:0;">${p.municipio || ''}</span>
      </div>`).join('');
  }, 300);
}
function vincularUsuarioAtencion(usuarioId, nombre){
  window.__atencionUsuarioVinculado = usuarioId;
  document.getElementById('at-nombre').value = nombre;
  document.getElementById('at-buscar-usuario').value = '';
  document.getElementById('at-resultados-busqueda').innerHTML = '';
  const chip = document.getElementById('at-usuario-vinculado');
  chip.style.display = 'inline-flex';
  document.getElementById('at-usuario-vinculado-texto').textContent = 'Vinculado a: ' + nombre;
}
function desvincularUsuarioAtencion(){
  window.__atencionUsuarioVinculado = null;
  document.getElementById('at-usuario-vinculado').style.display = 'none';
}

async function guardarAtencion(){
  const btn = document.getElementById('at-save-btn');
  const nombre = document.getElementById('at-nombre').value.trim();
  if(!nombre){
    document.getElementById('atencion-content').insertAdjacentHTML('afterbegin', `<div class="auth-error">Escribe un nombre o referencia para la persona.</div>`);
    return;
  }
  btn.disabled = true; btn.textContent = 'Guardando…';

  const getChecked = name => Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(el => el.value);
  const getRadio = name => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; };

  const payload = {
    nombre_referencia: nombre,
    usuario_id: window.__atencionUsuarioVinculado || null,
    creado_por_email: CURRENT_USER.email,
    duracion_minutos: document.getElementById('at-duracion').value ? parseInt(document.getElementById('at-duracion').value, 10) : null,
    prestaciones: getChecked('at-prestaciones'),
    tramites_bretxa: getChecked('at-tramites'),
    derivacion: getRadio('at-derivacion'),
    emprendeduria: getChecked('at-emprendeduria'),
    como_conocio: getRadio('at-conocio'),
    necesidades_no_catalogadas: document.getElementById('at-necesidades-nuevas').value.trim() || null,
    notas: document.getElementById('at-notas').value.trim() || null
  };

  const { error } = await sb.from('atenciones').insert(payload);
  if(error){
    document.getElementById('atencion-content').insertAdjacentHTML('afterbegin', `<div class="auth-error">${error.message}</div>`);
    btn.disabled = false; btn.textContent = 'Guardar atención';
    return;
  }
  showScreen('miespacio');
  renderMiEspacio();
}

function construirHistorial(actuaciones, tramites, documentos, citas){
  const eventos = [];
  (actuaciones||[]).forEach(a => eventos.push({fecha:a.fecha, tipo:'🗒️ Actuación', desc:a.descripcion || a.categoria || 'Actuación registrada'}));
  (tramites||[]).forEach(t => {
    eventos.push({fecha:t.fecha_inicio || t.creado_en, tipo:'📋 Trámite abierto', desc:t.nombre_servicio});
    if(t.fecha_fin) eventos.push({fecha:t.fecha_fin, tipo:'✅ Trámite cerrado', desc:t.nombre_servicio});
  });
  (documentos||[]).forEach(d => eventos.push({fecha:d.subido_en, tipo:'📎 Documento subido', desc:d.nombre_archivo}));
  (citas||[]).forEach(c => eventos.push({fecha:c.fecha, tipo:'📅 Cita', desc:c.motivo || c.estado}));
  eventos.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  return eventos.length
    ? eventos.map(e => `<div class="panel-stat-row"><span>${e.tipo}<br><span class="subtle" style="font-size:11px;margin:0;">${e.desc || ''}</span></span><span class="subtle" style="margin:0;font-size:11px;white-space:nowrap;">${e.fecha ? new Date(e.fecha).toLocaleDateString('es-ES') : ''}</span></div>`).join('')
    : `<div class="empty-note">Sin actividad registrada todavía.</div>`;
}

  const [perfilRes, docsRes, tramitesRes, atencionesRes, actuacionesRes, staffListRes, citasRes] = await Promise.all([
    sb.from('perfiles').select('*').eq('id', usuarioId).maybeSingle(),
    sb.from('documentos').select('*').eq('usuario_id', usuarioId).order('subido_en', { ascending:false }),
    sb.from('tramites').select('*').eq('usuario_id', usuarioId).order('creado_en', { ascending:false }),
    sb.from('atenciones').select('*').eq('usuario_id', usuarioId).order('creado_en', { ascending:false }),
    sb.from('actuaciones').select('*').eq('usuario_id', usuarioId).order('fecha', { ascending:false }),
    sb.from('staff').select('email, nombre, activo').order('email', { ascending:true }),
    sb.from('citas').select('*').eq('usuario_id', usuarioId).order('fecha', { ascending:false })
  ]);

  (staffListRes.data || []).forEach(s => { if(s.nombre) __mapaNombresTecnicos[s.email] = s.nombre; });

  const p = perfilRes.data;
  if(!p){ cont.innerHTML = `<div class="empty-note">No se encontró el perfil de esta persona.</div>`; return; }

  const campo = (label, valor) => valor ? `<div class="panel-stat-row"><span>${label}</span><span><strong>${valor}</strong></span></div>` : '';
  const campoBool = (label, valor) => valor === true ? `<div class="panel-stat-row"><span>${label}</span><span><strong>Sí</strong></span></div>` : '';

  const docsHtml = (docsRes.data && docsRes.data.length)

          <span>${d.nombre_archivo}${d.tipo_documento==='curriculum' ? ' <span class="chip gold">CV</span>' : ''}${d.tipo_documento==='consentimiento' ? ' <span class="chip good">Consentimiento</span>' : ''}</span>

        </div>`).join('')
    : `<div class="empty-note">Sin documentos</div>`;

  const tramitesHtml = (tramitesRes.data && tramitesRes.data.length)
    ? tramitesRes.data.map(tr => `
        <div class="panel-stat-row" style="align-items:flex-start;">
          <span>${tr.nombre_servicio}<br><span class="subtle" style="font-size:11px;margin:0;">Inicio: ${tr.fecha_inicio ? new Date(tr.fecha_inicio).toLocaleDateString('es-ES') : '—'}${tr.fecha_fin ? ' · Fin: ' + new Date(tr.fecha_fin).toLocaleDateString('es-ES') : ''}</span></span>

  const atencionesHtml = (atencionesRes.data && atencionesRes.data.length)

          ${a.prestaciones && a.prestaciones.length ? `<div class="panel-stat-row"><span>Prestaciones</span><span>${a.prestaciones.join(', ')}</span></div>` : ''}

    : `<div class="empty-note">Nadie ha registrado todavía una atención a esta persona.</div>`;

  const actuacionesLista = actuacionesRes.data || [];
  const actuacionesHtml = actuacionesLista.length
    ? actuacionesLista.map(renderActuacionCard).join('')
    : `<div class="empty-note">Todavía no hay actuaciones registradas.</div>`;

  const proyectosLista = actuacionesLista.filter(ac => PROYECTOS_LOGOS.includes(ac.categoria));
  const proyectosHtml = proyectosLista.length ? proyectosLista.map(renderActuacionCard).join('') : `<div class="empty-note">Sin actuaciones vinculadas a proyectos todavía.</div>`;

  const formacionesLista = actuacionesLista.filter(ac => FORMACIONES_LOGOS.includes(ac.categoria));
  const formacionesHtml = formacionesLista.length ? formacionesLista.map(renderActuacionCard).join('') : `<div class="empty-note">Sin actuaciones vinculadas a formaciones todavía.</div>`;

  const derivacionesLista = actuacionesLista.filter(ac => ac.derivado_a);
  const derivacionesHtml = derivacionesLista.length ? derivacionesLista.map(renderActuacionCard).join('') : `<div class="empty-note">Sin derivaciones registradas.</div>`;

  const historialHtml = construirHistorial(actuacionesLista, tramitesRes.data, docsRes.data, citasRes.data);

  const citasHtml = (citasRes.data && citasRes.data.length)
    ? citasRes.data.map(c => `
        <div class="panel-stat-row">
          <span>${new Date(c.fecha).toLocaleDateString('es-ES')} · ${c.hora || ''}${c.motivo ? `<br><span class="subtle" style="font-size:11px;margin:0;">${c.motivo}</span>` : ''}</span>
          <span class="chip ${c.estado==='confirmada'?'good':(c.estado==='cancelada'?'':'gold')}" style="${c.estado==='cancelada'?'background:#EEE;color:#888;':''}">${c.estado}</span>
        </div>`).join('')
    : `<div class="empty-note">Sin citas registradas</div>`;

  const staffOptions = (staffListRes.data || []).filter(s => s.activo !== false).map(s => `<option value="${s.email}" ${p.tecnico_responsable_email===s.email?'selected':''}>${s.nombre || s.email}</option>`).join('');

  cont.innerHTML = `

    <div class="panel-card">
      ${campo('Correo', p.email)} ${campo('Fecha de alta', p.creado_en ? new Date(p.creado_en).toLocaleDateString('es-ES') : '')}

      </div>
      ${campo('DNI/NIE', p.dni_nie)} ${campo('Fecha de nacimiento', p.fecha_nacimiento)}
      ${campo('Teléfono', p.telefono)} ${campo('Calle', p.calle)}
      ${campo('Municipio', p.municipio)} ${campo('Código postal', p.codigo_postal)} ${campo('Provincia', p.provincia)}
      ${campo('Con quién vive', p.convivencia)} ${campo('Personas en el hogar', p.personas_hogar)} ${campo('Número de hijos', p.numero_hijos)}
      ${campo('Sexo', p.sexo)} ${campo('Nacionalidad', p.nacionalidad)} ${campo('Situación de regularización', p.situacion_regularizacion)} ${campo('Situación laboral', p.situacion_laboral)} ${campo('Nivel de estudios', p.nivel_estudios)}
      ${campo('Titulaciones/cursos', p.titulaciones_cursos)} ${campo('Experiencia laboral', p.experiencia_laboral)}
      ${campo('Nivel de ingresos', p.nivel_ingresos)}
      ${campoBool('Discapacidad reconocida', p.discapacidad_reconocida)} ${campo('% Discapacidad', p.porcentaje_discapacidad)}
      ${campoBool('Dependencia reconocida', p.dependencia_reconocida)}
      ${campoBool('Familia monoparental', p.familia_monoparental)} ${campoBool('Familia numerosa', p.familia_numerosa)}
      ${campoBool('Hijos a cargo', p.hijos_a_cargo)} ${campoBool('En desempleo', p.situacion_desempleo)}
    </div>

    <div class="persona-tabs">
      <button class="ptab-btn" data-tab="proyectos" onclick="mostrarTabPersona('proyectos')">Proyectos</button>
      <button class="ptab-btn" data-tab="formaciones" onclick="mostrarTabPersona('formaciones')">Formaciones</button>
      <button class="ptab-btn" data-tab="tramites" onclick="mostrarTabPersona('tramites')">Trámites</button>
      <button class="ptab-btn active" data-tab="actuaciones" onclick="mostrarTabPersona('actuaciones')">Actuaciones</button>
      <button class="ptab-btn" data-tab="documentos" onclick="mostrarTabPersona('documentos')">Documentos</button>
      <button class="ptab-btn" data-tab="citas" onclick="mostrarTabPersona('citas')">Citas</button>
      <button class="ptab-btn" data-tab="derivaciones" onclick="mostrarTabPersona('derivaciones')">Derivaciones</button>
      <button class="ptab-btn" data-tab="historial" onclick="mostrarTabPersona('historial')">Historial</button>
      <button class="ptab-btn" data-tab="quienatendio" onclick="mostrarTabPersona('quienatendio')">Quién ha atendido</button>
    </div>

    <div class="ptab-content" id="ptab-proyectos">
      <div class="panel-card"><h3>Actuaciones vinculadas a proyectos</h3>${proyectosHtml}</div>
    </div>

    <div class="ptab-content" id="ptab-formaciones">
      <div class="panel-card"><h3>Actuaciones vinculadas a formaciones</h3>${formacionesHtml}</div>
    </div>

    <div class="ptab-content active" id="ptab-actuaciones">
      <div class="panel-card">
        ${actuacionesHtml}
        <div class="doc-upload-row" style="margin-top:10px;text-align:left;">
          <div class="field"><label>Fecha</label><input type="date" id="act-fecha" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="field">
            <label>Proyecto / trámite / formación</label>
            <select id="act-categoria" onchange="document.getElementById('act-categoria-otro').style.display = this.value==='__otro__' ? 'block' : 'none';">
              <option value="">—</option>
              <optgroup label="Proyectos">${PROYECTOS_LOGOS.map(p => `<option value="${p}">${p}</option>`).join('')}</optgroup>
              <optgroup label="Formaciones">${FORMACIONES_LOGOS.map(f => `<option value="${f}">${f}</option>`).join('')}</optgroup>
              <option value="Trámite administrativo">Trámite administrativo</option>

            <input type="text" id="act-categoria-otro" placeholder="Especifica" style="display:none;margin-top:6px;">
          </div>
          <div class="field"><label>Objetivo</label><input type="text" id="act-objetivo" placeholder="Ej: Facilitar el acceso a un trámite"></div>
          <div class="field"><label>Actuación realizada</label><textarea id="act-descripcion" rows="2" placeholder="Qué se ha hecho en esta atención"></textarea></div>
          <div class="field">
            <label>Resultado</label>
            <div style="display:flex;gap:6px;">
              <button type="button" class="resultado-btn" data-val="conseguido" onclick="seleccionarResultado(this)">Conseguido</button>
              <button type="button" class="resultado-btn" data-val="en_tramite" onclick="seleccionarResultado(this)">En trámite</button>

            <input type="hidden" id="act-resultado" value="">

          <div class="field">
            <label>Derivado a (opcional)</label>
            <select id="act-derivado-a">
              <option value="">No procede</option>

              <option value="OMAC">OMAC</option>
              <option value="IMSST">IMSST</option>

              <option value="PASS">PASS</option>
              <option value="ICAT">ICAT</option>
            </select>
          </div>
          <div class="field"><label>Próximo paso</label><input type="text" id="act-proximo-paso" placeholder="Ej: Presentar solicitud"></div>
          <div class="field"><label>Fecha próxima revisión</label><input type="date" id="act-fecha-revision"></div>
          <button class="primary-btn" onclick="crearActuacion()">➕ Registrar actuación</button>

    <div class="ptab-content" id="ptab-tramites">
      <div class="panel-card">
        ${tramitesHtml}
        <div class="doc-upload-row" style="margin-top:10px;">

          <div class="field" style="margin-bottom:8px;"><label>Fecha de inicio</label><input type="date" id="nuevo-tramite-fecha" value="${new Date().toISOString().slice(0,10)}"></div>
          <button class="link-btn" onclick="crearTramite()">➕ Abrir trámite</button>
        </div>
      </div>
    </div>

    <div class="ptab-content" id="ptab-documentos">
      <div class="panel-card">
        ${docsHtml}
        <div class="doc-upload-row" style="margin-top:10px;">
          <input type="file" id="staff-doc-input">
          <label class="checkbox-row" style="justify-content:center;"><input type="checkbox" id="staff-doc-es-cv"> Es un currículum</label>
          <button class="link-btn" style="margin-top:8px;" onclick="subirDocumentoStaff()">Subir documento a esta persona</button>
        </div>
      </div>
    </div>

    <div class="ptab-content" id="ptab-citas">
      <div class="panel-card">${citasHtml}</div>
    </div>

    <div class="ptab-content" id="ptab-derivaciones">
      <div class="panel-card"><h3>Derivaciones registradas</h3>${derivacionesHtml}</div>
    </div>

    <div class="ptab-content" id="ptab-historial">
      <div class="panel-card">${historialHtml}</div>
    </div>

    <div class="ptab-content" id="ptab-quienatendio">
      ${atencionesHtml}
    </div>
  `;
}

function mostrarTabPersona(nombre){
  document.querySelectorAll('.ptab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === nombre));
  document.querySelectorAll('.ptab-content').forEach(c => c.classList.toggle('active', c.id === 'ptab-'+nombre));
}

async function asignarTecnicoResponsable(){
  const email = document.getElementById('tecnico-responsable-select').value;
  const { error } = await sb.from('perfiles').update({ tecnico_responsable_email: email || null }).eq('id', window.__usuarioIdVisto);
  if(error){ alert(error.message); return; }
  verPersonaStaff(window.__usuarioIdVisto, window.__origenPersonaVista);
}

function seleccionarResultado(btn){
  const grupo = btn.parentElement;
  grupo.querySelectorAll('.resultado-btn').forEach(b => b.classList.remove('sel-good','sel-gold','sel-alert'));
  const clases = { conseguido:'sel-good', en_tramite:'sel-gold', no_conseguido:'sel-alert' };
  btn.classList.add(clases[btn.dataset.val]);
  document.getElementById('act-resultado').value = btn.dataset.val;
}

async function crearActuacion(){
  const val = id => document.getElementById(id).value.trim();
  const categoriaVal = val('act-categoria');
  const categoriaFinal = categoriaVal === '__otro__' ? (val('act-categoria-otro') || null) : (categoriaVal || null);
  const { error } = await sb.from('actuaciones').insert({
    usuario_id: window.__usuarioIdVisto,
    tecnico_email: CURRENT_USER.email,
    fecha: val('act-fecha') || new Date().toISOString().slice(0,10),
    categoria: categoriaFinal,
    objetivo: val('act-objetivo') || null,
    descripcion: val('act-descripcion') || null,
    resultado: val('act-resultado') || null,
    derivado_a: val('act-derivado-a') || null,
    proximo_paso: val('act-proximo-paso') || null,
    fecha_proxima_revision: val('act-fecha-revision') || null
  });
  if(error){ alert(error.message); return; }
  verPersonaStaff(window.__usuarioIdVisto, window.__origenPersonaVista);
}

async function crearTramite(){
  const nombre = document.getElementById('nuevo-tramite-nombre').value.trim();
  const fecha = document.getElementById('nuevo-tramite-fecha').value;
  if(!nombre){ alert('Escribe el nombre del trámite.'); return; }
  const { error } = await sb.from('tramites').insert({
    usuario_id: window.__usuarioIdVisto,
    nombre_servicio: nombre,
    estado: 'en_curso',
    fecha_inicio: fecha || new Date().toISOString().slice(0,10)
  });
  if(error){ alert(error.message); return; }
  verPersonaStaff(window.__usuarioIdVisto, window.__origenPersonaVista);
}

async function marcarTramiteHecho(tramiteId){
  const { error } = await sb.from('tramites').update({
    estado: 'hecho',
    fecha_fin: new Date().toISOString().slice(0,10)
  }).eq('id', tramiteId);
  if(error){ alert(error.message); return; }
  verPersonaStaff(window.__usuarioIdVisto, window.__origenPersonaVista);
}

const ADMIN_PAGE_SIZE = 40;
let __adminAtencionesOffset = 0;
let __adminAtencionesTodas = [];
let __adminFichajesOffset = 0;
let __adminFichajesTodos = [];
let __adminActuacionesOffset = 0;
let __adminActuacionesTodas = [];
let __adminNombresPersona = {};

let __mapaNombresTecnicos = {};
function nombreTecnico(email){
  return __mapaNombresTecnicos[email] || email;
}

async function renderAdministrador(){
  const cont = document.getElementById('admin-content');
  if(!IS_ADMIN){ cont.innerHTML = `<div class="placeholder">Esta sección es solo para el responsable de Logos.</div>`; return; }
  cont.innerHTML = `<div class="placeholder">Cargando…</div>`;

  __adminAtencionesOffset = 0;
  __adminAtencionesTodas = [];
  __adminFichajesOffset = 0;
  __adminFichajesTodos = [];
  __adminActuacionesOffset = 0;
  __adminActuacionesTodas = [];

  const [primeraPagina, cargaRes, staffRes, fichajesPrimeraPagina, fichajesCountRes, necesidadesRes, revisionesRes, perfilesIncompletosRes, actuacionesPrimeraPagina, actuacionesCountRes, actuacionesLigeroRes] = await Promise.all([
    sb.from('atenciones').select('*').order('creado_en', { ascending:false }).range(0, ADMIN_PAGE_SIZE - 1),
    sb.from('atenciones').select('creado_por_email'), // sin límite: solo para el conteo de carga de trabajo
    sb.from('staff').select('*').order('email', { ascending:true }),
    sb.from('fichajes').select('*').order('entrada', { ascending:false }).range(0, ADMIN_PAGE_SIZE - 1),
    sb.from('fichajes').select('id', { count: 'exact', head: true }),
    sb.from('atenciones').select('necesidades_no_catalogadas, creado_en, nombre_referencia').not('necesidades_no_catalogadas', 'is', null).order('creado_en', { ascending:false }).limit(50),
    sb.from('actuaciones').select('*').not('fecha_proxima_revision', 'is', null).order('fecha_proxima_revision', { ascending:true }).limit(100),
    sb.from('perfiles').select('id, nombre_completo, dni_nie, telefono, calle').not('nombre_completo', 'is', null),
    sb.from('actuaciones').select('*').order('fecha', { ascending:false }).range(0, ADMIN_PAGE_SIZE - 1),
    sb.from('actuaciones').select('id', { count: 'exact', head: true }),
    sb.from('actuaciones').select('usuario_id, fecha')
  ]);

  window.__staffLista = staffRes.data || [];
  __mapaNombresTecnicos = {};
  (staffRes.data || []).forEach(s => { if(s.nombre) __mapaNombresTecnicos[s.email] = s.nombre; });
  __adminAtencionesTodas = primeraPagina.data || [];
  __adminAtencionesOffset = __adminAtencionesTodas.length;
  __adminFichajesTodos = fichajesPrimeraPagina.data || [];
  __adminFichajesOffset = __adminFichajesTodos.length;
  const totalFichajes = fichajesCountRes.count || 0;
  __adminActuacionesTodas = actuacionesPrimeraPagina.data || [];
  __adminActuacionesOffset = __adminActuacionesTodas.length;
  const totalActuaciones = actuacionesCountRes.count || 0;

  // Carga de trabajo por técnico (sobre TODAS las atenciones, no solo la página cargada)
  const cargaPorTecnico = {};
  (cargaRes.data || []).forEach(a => { cargaPorTecnico[a.creado_por_email] = (cargaPorTecnico[a.creado_por_email]||0) + 1; });
  const cargaOrdenada = Object.entries(cargaPorTecnico).sort((a,b)=>b[1]-a[1]);
  const maxCarga = cargaOrdenada.length ? cargaOrdenada[0][1] : 0;
  const totalAtenciones = (cargaRes.data || []).length;

  const staffHtml = window.__staffLista.map(s => `
    <div class="panel-stat-row">
      <span>${s.nombre ? `<strong>${s.nombre}</strong><br><span class="subtle" style="font-size:11px;margin:0;">${s.email}</span>` : s.email}${s.es_admin ? ' <span class="chip gold">admin</span>' : ''}</span>
      <span style="display:flex;align-items:center;gap:8px;">
        <span class="chip ${s.activo === false ? 'off' : 'good'}">${s.activo === false ? 'Inactivo' : 'Activo'}</span>
        <button class="link-btn" style="font-size:12px;" onclick="toggleActivoTecnico('${s.email}', ${s.activo === false})">${s.activo === false ? 'Reactivar' : 'Desactivar'}</button>
      </span>
    </div>`).join('');

  const necesidadesHtml = (necesidadesRes.data && necesidadesRes.data.length)
    ? necesidadesRes.data.map(n => `
        <div class="pull-quote">"${n.necesidades_no_catalogadas}"<div style="font-family:var(--font-body);font-style:normal;font-size:11px;color:var(--ink-soft);margin-top:6px;">${n.nombre_referencia} · ${new Date(n.creado_en).toLocaleDateString('es-ES')}</div></div>`).join('')
    : `<div class="empty-note">Nadie ha pedido todavía algo fuera del catálogo. Buena señal, o toca preguntar más 🙂</div>`;

  const nombresPersona = {};
  (perfilesIncompletosRes.data || []).forEach(p => { nombresPersona[p.id] = p.nombre_completo; });
  __adminNombresPersona = nombresPersona;

  const hoyAdmin = new Date(); hoyAdmin.setHours(0,0,0,0);
  const revisionesHtml = (revisionesRes.data && revisionesRes.data.length)
    ? revisionesRes.data.map(r => {
        const vencida = new Date(r.fecha_proxima_revision) < hoyAdmin;
        return `<div class="panel-stat-row">
          <span>${nombresPersona[r.usuario_id] || 'Persona sin nombre'}<br><span class="subtle" style="font-size:11px;margin:0;">${nombreTecnico(r.tecnico_email)}${r.categoria ? ' · ' + r.categoria : ''}</span></span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="chip ${vencida ? '' : 'gold'}" style="${vencida ? 'background:var(--alert-soft);color:var(--alert);' : ''}">${new Date(r.fecha_proxima_revision).toLocaleDateString('es-ES')}${vencida ? ' · vencida' : ''}</span>
            ${r.usuario_id ? `<button class="link-btn" style="font-size:11px;" onclick="verPersonaStaff('${r.usuario_id}','admin')">Ver</button>` : ''}
          </span>
        </div>`;
      }).join('')
    : `<div class="empty-note">No hay revisiones pendientes de nadie.</div>`;

  const camposClave = [['dni_nie','DNI/NIE'], ['telefono','Teléfono'], ['calle','Dirección']];
  const perfilesIncompletos = (perfilesIncompletosRes.data || []).filter(p => camposClave.some(([campo]) => !p[campo]));
  const incompletosHtml = perfilesIncompletos.length
    ? perfilesIncompletos.slice(0, 30).map(p => {
        const faltan = camposClave.filter(([campo]) => !p[campo]).map(([,label]) => label);
        return `<div class="panel-stat-row">
          <span>${p.nombre_completo}<br><span class="subtle" style="font-size:11px;margin:0;">Falta: ${faltan.join(', ')}</span></span>
          <button class="link-btn" style="font-size:11px;" onclick="verPersonaStaff('${p.id}','admin')">Ver</button>
        </div>`;
      }).join('')
    : `<div class="empty-note">Todo el mundo tiene sus datos básicos completos 🙌</div>`;

  // Historial de personas: agrupar actuaciones por persona (nombre, nº de actuaciones, última fecha)
  const porPersona = {};
  (actuacionesLigeroRes.data || []).forEach(a => {
    if(!a.usuario_id) return;
    if(!porPersona[a.usuario_id]) porPersona[a.usuario_id] = { count: 0, ultima: a.fecha };
    porPersona[a.usuario_id].count++;
    if(new Date(a.fecha) > new Date(porPersona[a.usuario_id].ultima)) porPersona[a.usuario_id].ultima = a.fecha;
  });
  const historialPersonas = Object.entries(porPersona)
    .map(([id, info]) => ({ id, ...info, nombre: nombresPersona[id] || 'Persona sin nombre' }))
    .sort((a,b) => new Date(b.ultima) - new Date(a.ultima));
  const historialPersonasHtml = historialPersonas.length
    ? historialPersonas.map(p => `
        <div class="panel-stat-row">
          <span>${p.nombre}<br><span class="subtle" style="font-size:11px;margin:0;">${p.count} actuación${p.count===1?'':'es'} · última: ${new Date(p.ultima).toLocaleDateString('es-ES')}</span></span>
          <button class="link-btn" style="font-size:12px;" onclick="verPersonaStaff('${p.id}','admin')">Ver su espacio →</button>
        </div>`).join('')
    : `<div class="empty-note">Todavía no hay personas con actuaciones registradas.</div>`;

  cont.innerHTML = `
    <div class="cards-grid" style="margin-bottom:16px;">
      <div class="panel-card">
        <h3>🔔 Próximas revisiones pendientes</h3>
        <p class="subtle" style="margin:0 0 10px;">De todos los técnicos, ordenadas por fecha. Las vencidas aparecen en rojo.</p>
        ${revisionesHtml}
      </div>
      <div class="panel-card">
        <h3>📋 Perfiles con datos incompletos</h3>
        <p class="subtle" style="margin:0 0 10px;">${perfilesIncompletos.length} de ${(perfilesIncompletosRes.data||[]).length} personas les falta DNI/NIE, teléfono o dirección.${perfilesIncompletos.length > 30 ? ' Mostrando las primeras 30.' : ''}</p>
        ${incompletosHtml}
      </div>
    </div>

    <div class="panel-card" style="margin-bottom:16px;">
      <h3>👥 Historial de personas</h3>
      <p class="subtle" style="margin:0 0 10px;">Todas las personas con al menos una actuación registrada, ordenadas por la más reciente. Toca "Ver su espacio" para entrar a su ficha completa (con su historial, trámites, documentos y citas).</p>
      ${historialPersonasHtml}
    </div>

    <div class="info-box info-box-gold" style="margin-bottom:16px;">
      <div class="info-box-title">Fuera del catálogo</div>
      <p style="margin-bottom:12px;">Lo que la gente ha pedido y que los técnicos han marcado como "no está en el catálogo". Útil para decidir qué fichas nuevas escribir primero.</p>
      ${necesidadesHtml}
    </div>

    <div class="cards-grid" style="margin-bottom:16px;">
      <div class="panel-card">
        <h3>Carga de trabajo por técnico</h3>
        <p class="subtle" style="margin:0 0 10px;">Sobre el total histórico: ${totalAtenciones} atenciones registradas.</p>
        ${cargaOrdenada.length ? cargaOrdenada.map(([email,v]) => barRow(nombreTecnico(email), v, maxCarga)).join('') : `<div class="empty-note">Sin datos todavía</div>`}
      </div>

      <div class="panel-card">
        <h3>Gestión de personal</h3>
        ${staffHtml}
        <div class="field" style="margin-top:12px;">
          <label>Añadir nuevo técnico (correo)</label>
          <input type="email" id="admin-nuevo-email" placeholder="tcnlogos15@gmail.com">
        </div>
        <button class="link-btn" onclick="agregarTecnico()">➕ Añadir a la plataforma</button>
      </div>
    </div>

    <p class="subtle" style="margin-top:18px;">Fichajes del personal.</p>
    <div class="panel-card" id="admin-fichajes-lista">${renderFilasFichajes(__adminFichajesTodos)}</div>
    <div style="text-align:center;margin-top:8px;margin-bottom:18px;" id="admin-fichajes-cargar-mas-wrap">
      ${totalFichajes > __adminFichajesTodos.length
        ? `<button class="link-btn" onclick="cargarMasFichajes()">Cargar ${Math.min(ADMIN_PAGE_SIZE, totalFichajes - __adminFichajesTodos.length)} más (de ${totalFichajes} en total)</button>`
        : ''}
    </div>

    <p class="subtle" style="margin-top:18px;">Registro completo de qué técnico ha atendido a quién y con qué servicios.</p>
    <div class="cards-grid" id="admin-atenciones-grid">${renderFilasAtenciones(__adminAtencionesTodas)}</div>
    <div style="text-align:center;margin-top:18px;margin-bottom:24px;" id="admin-cargar-mas-wrap">
      ${totalAtenciones > __adminAtencionesTodas.length
        ? `<button class="link-btn" onclick="cargarMasAtenciones()">Cargar ${Math.min(ADMIN_PAGE_SIZE, totalAtenciones - __adminAtencionesTodas.length)} más (de ${totalAtenciones} en total)</button>`
        : ''}
    </div>

    <p class="subtle" style="margin-top:18px;">Registro completo de actuaciones (seguimiento de caso) de todos los técnicos.</p>
    <div class="cards-grid" id="admin-actuaciones-grid">${renderFilasActuacionesAdmin(__adminActuacionesTodas)}</div>
    <div style="text-align:center;margin-top:18px;margin-bottom:24px;" id="admin-actuaciones-cargar-mas-wrap">
      ${totalActuaciones > __adminActuacionesTodas.length
        ? `<button class="link-btn" onclick="cargarMasActuacionesAdmin()">Cargar ${Math.min(ADMIN_PAGE_SIZE, totalActuaciones - __adminActuacionesTodas.length)} más (de ${totalActuaciones} en total)</button>`
        : ''}
    </div>
  `;

  activarBarras();
}

function renderFilasActuacionesAdmin(lista){
  return lista.length
    ? lista.map(ac => `
        <div class="panel-card">
          <div class="panel-stat-row"><span>Persona</span><span><strong>${__adminNombresPersona[ac.usuario_id] || 'Sin nombre'}</strong></span></div>
          <div class="panel-stat-row"><span>Técnico</span><span><strong>${nombreTecnico(ac.tecnico_email)}</strong></span></div>
          <div class="panel-stat-row"><span>Fecha</span><span>${new Date(ac.fecha).toLocaleDateString('es-ES')}</span></div>
          ${ac.categoria ? `<div class="panel-stat-row"><span>Proyecto/trámite/formación</span><span>${ac.categoria}</span></div>` : ''}
          ${ac.resultado ? `<div class="panel-stat-row"><span>Resultado</span><span class="chip ${ac.resultado==='conseguido'?'good':(ac.resultado==='no_conseguido'?'':'gold')}" style="${ac.resultado==='no_conseguido'?'background:var(--alert-soft);color:var(--alert);':''}">${ac.resultado==='conseguido'?'Conseguido':(ac.resultado==='en_tramite'?'En trámite':'No conseguido')}</span></div>` : ''}
          ${ac.usuario_id ? `<button class="link-btn" style="font-size:12px;" onclick="verPersonaStaff('${ac.usuario_id}','admin')">👤 Ver información completa</button>` : ''}
        </div>`).join('')
    : `<div class="empty-note">Todavía no hay actuaciones registradas.</div>`;
}

async function cargarMasActuacionesAdmin(){
  const wrap = document.getElementById('admin-actuaciones-cargar-mas-wrap');
  wrap.innerHTML = `<span class="subtle">Cargando…</span>`;

  const { data } = await sb.from('actuaciones').select('*').order('fecha', { ascending:false })
    .range(__adminActuacionesOffset, __adminActuacionesOffset + ADMIN_PAGE_SIZE - 1);

  const nuevas = data || [];
  __adminActuacionesTodas = __adminActuacionesTodas.concat(nuevas);
  __adminActuacionesOffset += nuevas.length;

  document.getElementById('admin-actuaciones-grid').innerHTML = renderFilasActuacionesAdmin(__adminActuacionesTodas);

  const { count } = await sb.from('actuaciones').select('id', { count: 'exact', head: true });
  wrap.innerHTML = (count || 0) > __adminActuacionesTodas.length
    ? `<button class="link-btn" onclick="cargarMasActuacionesAdmin()">Cargar ${Math.min(ADMIN_PAGE_SIZE, count - __adminActuacionesTodas.length)} más (de ${count} en total)</button>`
    : '';
}

function renderFilasAtenciones(atenciones){
  return atenciones.length
    ? atenciones.map(a => {
        const servicios = [...(a.prestaciones||[]), ...(a.tramites_bretxa||[]), ...(a.emprendeduria||[]), a.derivacion].filter(Boolean).join(', ') || '—';
        return `
          <div class="panel-card">
            <div class="panel-stat-row"><span>Técnico</span><span><strong>${nombreTecnico(a.creado_por_email)}</strong></span></div>
            <div class="panel-stat-row"><span>Persona</span><span><strong>${a.nombre_referencia}${a.usuario_id ? ' <span class="chip good">con cuenta</span>' : ''}</strong></span></div>
            <div class="panel-stat-row"><span>Fecha</span><span>${new Date(a.creado_en).toLocaleString('es-ES')}</span></div>
            ${a.duracion_minutos ? `<div class="panel-stat-row"><span>Duración</span><span>${a.duracion_minutos} min</span></div>` : ''}
            <div class="panel-stat-row"><span>Servicios</span><span>${servicios}</span></div>
            ${a.usuario_id ? `<button class="link-btn" style="font-size:12px;" onclick="verPersonaStaff('${a.usuario_id}','admin')">👤 Ver información completa</button>` : ''}
          </div>`;
      }).join('')
    : `<div class="empty-note">Todavía no hay atenciones registradas.</div>`;
}

async function cargarMasAtenciones(){
  const wrap = document.getElementById('admin-cargar-mas-wrap');
  wrap.innerHTML = `<span class="subtle">Cargando…</span>`;

  const { data } = await sb.from('atenciones').select('*').order('creado_en', { ascending:false })
    .range(__adminAtencionesOffset, __adminAtencionesOffset + ADMIN_PAGE_SIZE - 1);

  const nuevas = data || [];
  __adminAtencionesTodas = __adminAtencionesTodas.concat(nuevas);
  __adminAtencionesOffset += nuevas.length;

  document.getElementById('admin-atenciones-grid').innerHTML = renderFilasAtenciones(__adminAtencionesTodas);

  const { count } = await sb.from('atenciones').select('id', { count: 'exact', head: true });
  wrap.innerHTML = (count || 0) > __adminAtencionesTodas.length
    ? `<button class="link-btn" onclick="cargarMasAtenciones()">Cargar ${Math.min(ADMIN_PAGE_SIZE, count - __adminAtencionesTodas.length)} más (de ${count} en total)</button>`
    : '';
}

function renderFilasFichajes(fichajes){
  const horaFmt = iso => new Date(iso).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
  const fechaFmt = iso => new Date(iso).toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short' });
  const duracionFmt = (ini, fin) => {
    const min = Math.round((new Date(fin) - new Date(ini)) / 60000);
    return `${Math.floor(min/60)}h ${min%60}min`;
  };
  return fichajes.length
    ? fichajes.map(f => `
        <div class="panel-stat-row">
          <span>${f.tecnico_email} · ${fechaFmt(f.entrada)}</span>
          <span>${horaFmt(f.entrada)}${f.salida ? ` – ${horaFmt(f.salida)} (${duracionFmt(f.entrada, f.salida)})` : ' <span class="chip gold">en curso</span>'}</span>
        </div>`).join('')
    : `<div class="empty-note">Todavía no hay fichajes registrados.</div>`;
}

async function cargarMasFichajes(){
  const wrap = document.getElementById('admin-fichajes-cargar-mas-wrap');
  wrap.innerHTML = `<span class="subtle">Cargando…</span>`;

  const { data } = await sb.from('fichajes').select('*').order('entrada', { ascending:false })
    .range(__adminFichajesOffset, __adminFichajesOffset + ADMIN_PAGE_SIZE - 1);

  const nuevos = data || [];
  __adminFichajesTodos = __adminFichajesTodos.concat(nuevos);
  __adminFichajesOffset += nuevos.length;

  document.getElementById('admin-fichajes-lista').innerHTML = renderFilasFichajes(__adminFichajesTodos);

  const { count } = await sb.from('fichajes').select('id', { count: 'exact', head: true });
  wrap.innerHTML = (count || 0) > __adminFichajesTodos.length
    ? `<button class="link-btn" onclick="cargarMasFichajes()">Cargar ${Math.min(ADMIN_PAGE_SIZE, count - __adminFichajesTodos.length)} más (de ${count} en total)</button>`
    : '';
}

async function agregarTecnico(){
  const input = document.getElementById('admin-nuevo-email');
  const email = input.value.trim().toLowerCase();
  if(!email){ alert('Escribe un correo.'); return; }
  const { error } = await sb.from('staff').insert({ email, activo: true });
  if(error){ alert(error.message); return; }
  renderAdministrador();
}

async function toggleActivoTecnico(email, nuevoEstadoActivo){
  await sb.from('staff').update({ activo: nuevoEstadoActivo }).eq('email', email);
  renderAdministrador();
}

renderLogin();
initAuth();

</script>
</body>
</html>
